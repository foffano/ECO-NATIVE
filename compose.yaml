name: eco-native
services:
  app:
    build:
      context: .
      target: production
    image: eco-native:local
    init: true
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 45s
    environment:
      ECO_NATIVE_HOST: 0.0.0.0
      ECO_NATIVE_PORT: "18765"
      ECO_NATIVE_DATA_DIR: /data
      ECO_NATIVE_ENV_PATH: /data/.env
      ECO_NATIVE_SECURE_COOKIES: ${ECO_NATIVE_SECURE_COOKIES:-true}
      ECO_NATIVE_MAX_BROWSERS: "2"
      ECO_NATIVE_JOB_QUEUE_SIZE: "32"
    ports:
      - "127.0.0.1:18765:18765"
    volumes:
      - eco-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  eco-data:
